aid: gronda
name: Gronda
description: Gronda is a professional community and learning platform for chefs and
  hospitality professionals, offering 70+ masterclasses and 20,000+ exclusive restaurant
  recipes from leading chefs, a chef directory and creator program, and team and culinary-school
  plans. Members share culinary creations, follow world-class chefs, and access PRO
  subscription content through the Gronda web and mobile apps. Backed by Speedinvest,
  Gronda was surfaced as a portfolio-company lead and profiled through the API Evangelist
  enrichment pipeline; it is a consumer/community product that does not currently
  publish a public developer API.
